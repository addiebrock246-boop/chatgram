<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhey Chatgram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: #16213e;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 15px;
      background: #0f3460;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .auth-box, .chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    .auth-box input {
      margin: 8px 0;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
    }
    .auth-box button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e94560;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 18px;
      word-wrap: break-word;
      position: relative;
      animation: fadeIn 0.2s;
    }
    .message.sent {
      align-self: flex-end;
      background: #0f3460;
    }
    .message.received {
      align-self: flex-start;
      background: #533483;
    }
    .message .sender {
      font-weight: bold;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .message .reactions {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      font-size: 0.9rem;
    }
    .message .react-btn {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 1.2rem;
      padding: 2px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #1a1a2e;
      color: #fff;
    }
    .input-area button {
      background: #e94560;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 1.2rem;
    }
    .media-btn {
      background: #0f3460;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logout-btn {
      background: #e94560;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      float: right;
    }
    .mention {
      color: #ffd700;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="header" id="headerText">Radhey Chatgram</div>
  <!-- Auth Section -->
  <div class="auth-box" id="authBox">
    <h3>Login / Sign Up</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="signupBtn" style="background:#533483;">Sign Up</button>
  </div>
  <!-- Chat Section (hidden initially) -->
  <div class="chat-box" id="chatBox" style="display:none;">
    <button class="logout-btn" id="logoutBtn">Logout</button>
    <div class="chat-messages" id="messages"></div>
    <div class="input-area">
      <input type="file" id="mediaInput" accept="image/*,video/*,audio/*" style="display:none;">
      <button class="media-btn" id="mediaBtn">📎</button>
      <button class="media-btn" id="voiceBtn">🎤</button>
      <input type="text" id="msgInput" placeholder="Message...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
  // ============ CONFIGURATION ============
  const BOT_TOKEN = '8487870898:AAFWQSpgFJeUUXSL7WgBfAeBaLbN3G1R3y8';
  // IMPORTANT: Replace with your actual group chat_id after creating the Telegram group and adding the bot.
  const GROUP_CHAT_ID = '-1001234567890'; // e.g., -1001234567890
  const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

  // ============ GLOBAL STATE ============
  let currentUser = null;
  let lastUpdateId = 0;
  let bannedIPs = [];
  let knownMessages = new Map(); // message_id -> message object to track reactions

  // ============ AUTH ============
  const authBox = document.getElementById('authBox');
  const chatBox = document.getElementById('chatBox');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  function getUsers() {
    const data = localStorage.getItem('chatgram_users');
    return data ? JSON.parse(data) : {};
  }

  function saveUsers(users) {
    localStorage.setItem('chatgram_users', JSON.stringify(users));
  }

  loginBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    if (!username || !password) return alert('Enter username and password');
    const users = getUsers();
    if (users[username] && users[username] === password) {
      currentUser = username;
      switchToChat();
    } else {
      alert('Invalid credentials');
    }
  });

  signupBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    if (!username || !password) return alert('Enter username and password');
    const users = getUsers();
    if (users[username]) return alert('Username already exists');
    users[username] = password;
    saveUsers(users);
    currentUser = username;
    switchToChat();
  });

  function switchToChat() {
    authBox.style.display = 'none';
    chatBox.style.display = 'flex';
    document.getElementById('headerText').innerText = `Radhey Chatgram - ${currentUser}`;
    fetchIPAndCheckBan().then(() => startPolling());
  }

  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    chatBox.style.display = 'none';
    authBox.style.display = 'flex';
    document.getElementById('headerText').innerText = 'Radhey Chatgram';
  });

  // ============ IP & BAN MANAGEMENT ============
  async function fetchIPAndCheckBan() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      const ip = data.ip;
      if (bannedIPs.includes(ip)) {
        alert('You are banned from this chat.');
        logoutBtn.click();
        return false;
      }
      return true;
    } catch (e) {
      console.error('IP fetch failed', e);
      return true; // allow if unable to check
    }
  }

  // ============ TELEGRAM API HELPERS ============
  async function telegramAPI(method, params = {}) {
    const url = `${API_BASE}/${method}`;
    const options = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    };
    if (method.startsWith('send') && (params.photo || params.video || params.voice || params.document)) {
      // Use FormData for file uploads
      const formData = new FormData();
      for (let key in params) {
        formData.append(key, params[key]);
      }
      options.body = formData;
      delete options.headers;
    } else {
      options.body = JSON.stringify(params);
    }
    const response = await fetch(url, options);
    const json = await response.json();
    if (!json.ok) console.error('Telegram API error:', json);
    return json.result;
  }

  // ============ MESSAGE HANDLING ============
  async function sendTextMessage(text) {
    if (!text.trim()) return;
    // Format mentions: @username -> <mention>username</mention> (Telegram doesn't support HTML mentions in groups easily, so we'll just send as text)
    await telegramAPI('sendMessage', {
      chat_id: GROUP_CHAT_ID,
      text: `[${currentUser}]: ${text}`,
      parse_mode: 'HTML',
    });
    document.getElementById('msgInput').value = '';
  }

  async function sendMedia(file) {
    const formData = new FormData();
    formData.append('chat_id', GROUP_CHAT_ID);
    formData.append('caption', `[${currentUser}]: `);
    let method = '';
    if (file.type.startsWith('image/')) {
      method = 'sendPhoto';
      formData.append('photo', file);
    } else if (file.type.startsWith('video/')) {
      method = 'sendVideo';
      formData.append('video', file);
    } else {
      method = 'sendDocument';
      formData.append('document', file);
    }
    await fetch(`${API_BASE}/${method}`, {
      method: 'POST',
      body: formData,
    });
  }

  async function sendVoice(blob) {
    const formData = new FormData();
    formData.append('chat_id', GROUP_CHAT_ID);
    formData.append('voice', blob, 'voice.ogg');
    formData.append('caption', `[${currentUser}]: 🎤 Voice message`);
    await fetch(`${API_BASE}/sendVoice`, {
      method: 'POST',
      body: formData,
    });
  }

  async function sendReaction(originalMessageId, emoji) {
    // Send as a special message that clients interpret
    await telegramAPI('sendMessage', {
      chat_id: GROUP_CHAT_ID,
      text: `/react ${originalMessageId} ${emoji}`,
    });
  }

  // ============ POLLING & UPDATES ============
  async function getUpdates() {
    const res = await telegramAPI('getUpdates', {
      offset: lastUpdateId + 1,
      timeout: 10,
    });
    if (res && res.length) {
      for (const update of res) {
        lastUpdateId = update.update_id;
        processUpdate(update);
      }
    }
  }

  function processUpdate(update) {
    if (!update.message || update.message.chat.id.toString() !== GROUP_CHAT_ID.toString()) return;
    const msg = update.message;
    const text = msg.text || msg.caption || '';
    if (!text) return;

    // Check for admin commands
    if (text.startsWith('/kick ')) {
      const targetUser = text.split(' ')[1];
      if (targetUser === currentUser) {
        // Ban current user IP
        fetchIPAndCheckBan().then(ip => {
          if (ip) {
            addBan(ip);
            alert('You have been kicked and banned.');
            logoutBtn.click();
          }
        });
      }
      return;
    }
    if (text.startsWith('/unblock ')) {
      const targetIP = text.split(' ')[1];
      removeBan(targetIP);
      return;
    }
    if (text.startsWith('/banip ')) {
      const ip = text.split(' ')[1];
      addBan(ip);
      return;
    }

    // Process reaction
    if (text.startsWith('/react ')) {
      const parts = text.split(' ');
      const messageId = parts[1];
      const emoji = parts[2];
      addReactionToMessage(messageId, emoji);
      return;
    }

    // Regular message
    displayMessage(msg);
  }

  function displayMessage(msg) {
    const messagesDiv = document.getElementById('messages');
    const existing = knownMessages.get(msg.message_id);
    if (existing) return; // already displayed

    const sender = msg.text?.split(']:')[0]?.replace('[', '') || 'Unknown';
    const content = msg.text?.replace(`[${sender}]: `, '') || msg.caption || 'Media';
    const isSent = sender === currentUser;

    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
    msgDiv.setAttribute('data-id', msg.message_id);
    msgDiv.innerHTML = `
      <div class="sender">${sender}</div>
      <div>${formatContent(content)}</div>
      <div class="reactions" id="reactions-${msg.message_id}"></div>
    `;
    messagesDiv.appendChild(msgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    knownMessages.set(msg.message_id, { element: msgDiv, sender, content });
  }

  function formatContent(text) {
    // Highlight mentions @username
    return text.replace(/@(\w+)/g, '<span class="mention">@$1</span>');
  }

  function addReactionToMessage(messageId, emoji) {
    const container = document.getElementById(`reactions-${messageId}`);
    if (!container) return;
    const existing = container.querySelector(`span[data-emoji="${emoji}"]`);
    if (existing) {
      existing.textContent = emoji + (parseInt(existing.getAttribute('data-count')) + 1);
      existing.setAttribute('data-count', parseInt(existing.getAttribute('data-count')) + 1);
    } else {
      const span = document.createElement('span');
      span.setAttribute('data-emoji', emoji);
      span.setAttribute('data-count', '1');
      span.textContent = emoji + '1';
      span.style.cursor = 'pointer';
      span.onclick = () => sendReaction(messageId, emoji);
      container.appendChild(span);
    }
  }

  // ============ BAN MANAGEMENT ============
  function addBan(ip) {
    if (!bannedIPs.includes(ip)) {
      bannedIPs.push(ip);
      localStorage.setItem('bannedIPs', JSON.stringify(bannedIPs));
    }
  }
  function removeBan(ip) {
    bannedIPs = bannedIPs.filter(i => i !== ip);
    localStorage.setItem('bannedIPs', JSON.stringify(bannedIPs));
  }
  function loadBans() {
    bannedIPs = JSON.parse(localStorage.getItem('bannedIPs') || '[]');
  }

  // ============ UI EVENTS ============
  document.getElementById('sendBtn').addEventListener('click', () => {
    const text = document.getElementById('msgInput').value;
    sendTextMessage(text);
  });
  document.getElementById('mediaBtn').addEventListener('click', () => {
    document.getElementById('mediaInput').click();
  });
  document.getElementById('mediaInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) sendMedia(file);
  });
  document.getElementById('voiceBtn').addEventListener('mousedown', startRecording);
  document.getElementById('voiceBtn').addEventListener('mouseup', stopRecording);

  let mediaRecorder;
  let audioChunks = [];
  async function startRecording() {
    audioChunks = [];
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/ogg' });
      sendVoice(blob);
    };
    mediaRecorder.start();
  }
  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  // ============ INIT ============
  function startPolling() {
    loadBans();
    setInterval(getUpdates, 3000);
    getUpdates(); // immediate first fetch
  }

  // Check if already logged in (from localStorage session)
  const savedUser = localStorage.getItem('chatgram_currentUser');
  if (savedUser) {
    currentUser = savedUser;
    switchToChat();
  }
</script>
</body>
</html>
